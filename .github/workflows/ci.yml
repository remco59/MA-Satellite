name: CI

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: microsoft/setup-msbuild@v2

      - name: Unit tests
        run: dotnet test MaSatellite.Tests.slnf -c Release --blame-hang-timeout 120s --blame-hang-dump-type none --logger "trx;LogFileName=tests.trx" --results-directory artifacts/test-results

      - name: Create dev certificate
        shell: pwsh
        run: |
          $pw = [Guid]::NewGuid().ToString('N')
          Write-Host "::add-mask::$pw"
          $secure = ConvertTo-SecureString $pw -AsPlainText -Force
          ./scripts/New-DevCertificate.ps1 -OutDir "$env:RUNNER_TEMP/cert" -PfxPassword $secure
          "CERT_PASSWORD=$pw" | Out-File -FilePath $env:GITHUB_ENV -Append
          "CERT_PFX=$env:RUNNER_TEMP/cert/MaSatellite.Dev.pfx" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build MSIX (x64)
        shell: pwsh
        run: |
          msbuild src/MaSatellite.App/MaSatellite.App.csproj /restore /v:minimal `
            /p:Configuration=Release /p:Platform=x64 `
            /p:AppxBundle=Never /p:UapAppxPackageBuildMode=SideloadOnly /p:GenerateAppxPackageOnBuild=true `
            "/p:AppxPackageDir=$PWD/artifacts/msix/" /p:AppxPackageSigningEnabled=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Sign MSIX
        shell: pwsh
        run: |
          Get-ChildItem artifacts/msix -Recurse -Filter *.msix | ForEach-Object {
            ./scripts/Sign-Msix.ps1 -Package $_.FullName -CertificatePfx $env:CERT_PFX -CertificatePassword $env:CERT_PASSWORD
          }

      - name: Collect MSIX artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/msix-dist | Out-Null
          Get-ChildItem artifacts/msix -Recurse -Filter *.msix | Copy-Item -Destination artifacts/msix-dist
          Copy-Item "$env:RUNNER_TEMP/cert/MaSatellite.Dev.cer" artifacts/msix-dist
          Copy-Item scripts/Install-Dev.ps1 artifacts/msix-dist
          Get-ChildItem artifacts/msix-dist

      - uses: actions/upload-artifact@v4
        with:
          name: ma-satellite-msix
          path: artifacts/msix-dist/*
          if-no-files-found: error

      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build .exe installer
        shell: pwsh
        run: ./scripts/Build-Installer.ps1

      - name: Test installer (install, start, uninstall)
        shell: pwsh
        timeout-minutes: 5
        run: |
          $setup = Get-ChildItem artifacts/dist -Filter 'ma-satellite-setup-*.exe' | Select-Object -First 1
          ./scripts/Test-Installer.ps1 -Installer $setup.FullName

      - uses: actions/upload-artifact@v4
        with:
          name: ma-satellite-installer
          path: artifacts/dist/ma-satellite-setup-*.exe
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/test-results/**

  # Pushing a tag like v0.1.0 publishes the installer and the MSIX bundle as a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          pattern: ma-satellite-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l release
          # The tag must match the app version baked into the installer file name (Directory.Build.props).
          test -f "release/ma-satellite-setup-${TAG#v}.exe" || { echo "::error::Tag $TAG does not match the built installer version"; exit 1; }
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" --title "ma-satellite ${TAG#v}" --generate-notes
