<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ma-satellite Now Playing</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    // Show script errors on the card itself: Lively has no visible console.
    window.onerror = function (msg, src, line) {
      var s = document.getElementById('status');
      if (s) { s.textContent = 'JS error: ' + msg + ' (' + String(src || '').split('/').pop() + ':' + line + ')'; }
    };
  </script>
</head>
<body>
  <div class="bg" id="bg" aria-hidden="true"><canvas id="bgCanvas"></canvas><i></i><i></i><i></i><i></i><i></i></div>
  <main id="card" class="card idle" aria-live="polite">
    <div class="art" id="art">
      <img id="artImg" alt="" hidden />
      <svg id="artPlaceholder" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v10.55A4 4 0 1 0 11 17V7h6V3H9z" /></svg>
    </div>
    <div class="info">
      <div class="title" id="title">Nothing playing</div>
      <div class="artist" id="artist"></div>
      <div class="album" id="album"></div>
      <div class="progress" id="progress">
        <span id="elapsed">0:00</span>
        <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
        <span id="total">0:00</span>
      </div>
      <div class="status" id="status">Connecting to ma-satellite…</div>
    </div>
    <div class="extra" id="extra">
      <div class="extra-inner">
        <div class="meta" id="meta"></div>
        <div class="controls" id="controls">
          <button class="ctl" id="btnShuffle" type="button" title="Shuffle" aria-label="Shuffle" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z" /></svg>
          </button>
          <button class="ctl" id="btnPrev" type="button" title="Previous" aria-label="Previous">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z" /></svg>
          </button>
          <button class="ctl big" id="btnPlay" type="button" title="Play" aria-label="Play">
            <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
            <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z" /></svg>
          </button>
          <button class="ctl" id="btnNext" type="button" title="Next" aria-label="Next">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2zM6 18l8.5-6L6 6z" /></svg>
          </button>
          <button class="ctl" id="btnRepeat" type="button" title="Repeat off" aria-label="Repeat" aria-pressed="false" data-mode="off">
            <svg class="i-repeat" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z" /></svg>
            <svg class="i-repeat-one" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4zm-4-2V9h-1l-2 1v1h1.5v4H13z" /></svg>
          </button>
          <button class="ctl" id="btnFav" type="button" title="Add to favourites" aria-label="Favourite" aria-pressed="false">
            <svg class="i-heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z" /></svg>
            <svg class="i-heart-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" /></svg>
          </button>
        </div>
      </div>
    </div>
  </main>
  <script src="widget.js" onerror="document.getElementById('status').textContent='widget.js failed to load'"></script>
</body>
</html>
