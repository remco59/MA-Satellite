<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ma-satellite Now Playing</title>
  <link rel="stylesheet" href="style.css" />
  <script>
    // Show script errors on the card itself: Lively has no visible console.
    window.onerror = function (msg, src, line) {
      var s = document.getElementById('status');
      if (s) { s.textContent = 'JS error: ' + msg + ' (' + String(src || '').split('/').pop() + ':' + line + ')'; }
    };
  </script>
</head>
<body>
  <!-- TEMPORARY build marker: remove once the Lively install is verified. -->
  <div style="position:fixed;top:0;left:0;right:0;padding:14px;background:#ff00aa;color:#fff;font:700 28px sans-serif;text-align:center;z-index:99">BUILD v6</div>
  <main id="card" class="card idle" aria-live="polite">
    <div class="art" id="art">
      <img id="artImg" alt="" hidden />
      <svg id="artPlaceholder" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3v10.55A4 4 0 1 0 11 17V7h6V3H9z" /></svg>
    </div>
    <div class="info">
      <div class="title" id="title">Nothing playing</div>
      <div class="artist" id="artist"></div>
      <div class="album" id="album"></div>
      <div class="progress" id="progress">
        <span id="elapsed">0:00</span>
        <div class="bar"><div class="fill" id="fill"></div></div>
        <span id="total">0:00</span>
      </div>
      <div class="status" id="status">Page loaded (v6), waiting for widget.js…</div>
    </div>
  </main>
  <script src="widget.js" onerror="document.getElementById('status').textContent='widget.js failed to load'"></script>
</body>
</html>
